name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 45m
          script: |
            set -Eeuo pipefail

            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"

            if [ -z "$PROJECT_PATH" ]; then
              echo "VPS_PROJECT_PATH is empty. Please set it to /opt/sanoto-b2b in GitHub Secrets."
              exit 1
            fi

            mkdir -p "$PROJECT_PATH"
            cd "$PROJECT_PATH"

            unset DRONE_SSH_PREV_COMMAND_EXIT_CODE || true
            rm -f .env

            echo "== Docker version =="
            docker --version
            docker compose version

            echo "== Create compose env =="
            cat > .compose.env <<'COMPOSE_ENV_EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT }}
            PROJECT_PATH=${{ secrets.VPS_PROJECT_PATH }}
            COMPOSE_ENV_EOF

            echo "== Create runtime env =="
            cat > runtime.env <<'RUNTIME_ENV_EOF'
            DB_NAME='${{ secrets.DB_NAME }}'
            DB_USER='${{ secrets.DB_USER }}'
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            DB_HOST='${{ secrets.DB_HOST }}'

            WP_ENV='${{ secrets.WP_ENV }}'
            WP_HOME='${{ secrets.WP_HOME }}'
            WP_SITEURL='${{ secrets.WP_SITEURL }}'

            MAIL_HOST='${{ secrets.MAIL_HOST }}'
            MAIL_PORT='${{ secrets.MAIL_PORT }}'
            MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
            MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'
            MAIL_FROM_ADDRESS='${{ secrets.MAIL_FROM_ADDRESS }}'
            MAIL_FROM_NAME='${{ secrets.MAIL_FROM_NAME }}'

            SMS_TOKEN='${{ secrets.SMS_TOKEN }}'
            SMS_SENDER='${{ secrets.SMS_SENDER }}'

            CLOUDINARY_CLOUD_NAME='${{ secrets.CLOUDINARY_CLOUD_NAME }}'
            CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}'
            CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}'

            B2B_CASSO_WEBHOOK_TOKEN='${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}'
            B2B_BANK_ACCOUNT_NAME='${{ secrets.B2B_BANK_ACCOUNT_NAME }}'
            B2B_BANK_ACCOUNT_NUMBER='${{ secrets.B2B_BANK_ACCOUNT_NUMBER }}'
            B2B_BANK_BIN='${{ secrets.B2B_BANK_BIN }}'
            B2B_BANK_NAME='${{ secrets.B2B_BANK_NAME }}'

            RUNTIME_ENV_EOF
            
            echo "== Create app env for Bedrock =="
            cp runtime.env app.env

            cat >> app.env <<'APP_ENV_EOF'

            AUTH_KEY='${{ secrets.AUTH_KEY }}'
            SECURE_AUTH_KEY='${{ secrets.SECURE_AUTH_KEY }}'
            LOGGED_IN_KEY='${{ secrets.LOGGED_IN_KEY }}'
            NONCE_KEY='${{ secrets.NONCE_KEY }}'
            AUTH_SALT='${{ secrets.AUTH_SALT }}'
            SECURE_AUTH_SALT='${{ secrets.SECURE_AUTH_SALT }}'
            LOGGED_IN_SALT='${{ secrets.LOGGED_IN_SALT }}'
            NONCE_SALT='${{ secrets.NONCE_SALT }}'
            APP_ENV_EOF

            echo "== Sanitize env files =="
            sed -i '/DRONE_SSH_PREV_COMMAND_EXIT_CODE/d' .compose.env runtime.env app.env 2>/dev/null || true
            sed -i '/PREV_COMMAND_EXIT_CODE/d' .compose.env runtime.env app.env 2>/dev/null || true
            sed -i '/\$? ; if \[/d' .compose.env runtime.env app.env 2>/dev/null || true
            chmod 644 .compose.env runtime.env app.env

            echo "== Verify env files are clean =="
            if grep -RniE 'DRONE_SSH|PREV_COMMAND|\$\? ; if' .compose.env runtime.env app.env 2>/dev/null; then
              echo "Dirty env content detected. Stop deploy."
              exit 1
            fi

            echo "== Create docker-compose.yml =="
            rm -f docker-compose.yml

            cat > docker-compose.yml <<'DOCKER_COMPOSE_EOF'
            services:
              wordpress:
                image: ${DOCKERHUB_USERNAME}/b2b-oto:latest
                container_name: sanoto-wordpress
                restart: unless-stopped

                entrypoint: ["/bin/sh"]
                command:
                  - "-c"
                  - |
                    set -e

                    test -f /deploy-env/app.env

                    cp /deploy-env/app.env /var/www/html/.env
                    chmod 644 /var/www/html/.env

                    mkdir -p \
                      /var/www/html/web/app/uploads \
                      /var/www/html/web/app/cache/acorn/framework/views \
                      /var/www/html/web/app/cache/acorn/framework/cache \
                      /var/www/html/web/app/cache/acorn/framework/sessions

                    chown -R www-data:www-data \
                      /var/www/html/web/app/uploads \
                      /var/www/html/web/app/cache

                    cat > /var/www/html/web/.htaccess <<'HTACCESS_EOF'
                    # BEGIN WordPress
                    <IfModule mod_rewrite.c>
                    RewriteEngine On
                    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
                    RewriteBase /
                    RewriteRule ^index\.php$ - [L]
                    RewriteCond %{REQUEST_FILENAME} !-f
                    RewriteCond %{REQUEST_FILENAME} !-d
                    RewriteRule . /index.php [L]
                    </IfModule>
                    # END WordPress
                    HTACCESS_EOF

                    chown www-data:www-data /var/www/html/web/.htaccess
                    chmod 644 /var/www/html/web/.htaccess
                    a2enmod rewrite >/dev/null 2>&1 || true

                    exec apache2-foreground

                extra_hosts:
                  - "host.docker.internal:host-gateway"

                env_file:
                  - ./runtime.env

                ports:
                  - "${APP_PORT:-8001}:80"

                volumes:
                  - ${PROJECT_PATH}:/deploy-env:ro
                  - uploads_data:/var/www/html/web/app/uploads
                  - cache_data:/var/www/html/web/app/cache

            volumes:
              uploads_data:
              cache_data:
            DOCKER_COMPOSE_EOF

            echo "== Show generated docker-compose.yml =="
            cat -n docker-compose.yml

            echo "== Check env files =="
            ls -la .compose.env runtime.env app.env docker-compose.yml
            test -s .compose.env
            test -s runtime.env
            test -s app.env
            test -s docker-compose.yml

            echo "== Docker login =="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "== Validate compose =="
            docker compose --env-file .compose.env config >/dev/null

            echo "== Kill stuck docker pull processes =="
            pkill -f "[d]ocker compose --env-file .compose.env pull wordpress" || true
            pkill -f "[d]ocker pull .*b2b-oto:latest" || true
            sleep 3

            echo "== Pull image with hard timeout and retry =="

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest"
            PULL_OK=0

            for i in 1 2 3; do
              echo "Pull attempt $i/3..."

              if timeout --kill-after=30s 420s docker pull "$IMAGE"; then
                echo "Pull image success."
                PULL_OK=1
                break
              fi

              echo "Pull image attempt $i failed or timed out."
              pkill -f "[d]ocker pull .*b2b-oto:latest" || true
              docker system prune -f || true
              sleep 20
            done

            if [ "$PULL_OK" != "1" ]; then
              echo "Pull image failed after 3 attempts."
              exit 1
            fi

            echo "== Stop old compose containers =="
            docker compose --env-file .compose.env down --remove-orphans || true

            echo "== Force remove stuck sanoto-wordpress container =="
            for i in $(seq 1 30); do
              if docker ps -a --format '{{.Names}}' | grep -qx 'sanoto-wordpress'; then
                echo "Attempt $i: sanoto-wordpress still exists, trying to remove..."
                docker rm -f sanoto-wordpress || true
                sleep 2
              else
                echo "Old sanoto-wordpress container removed."
                break
              fi
            done

            if docker ps -a --format '{{.Names}}' | grep -qx 'sanoto-wordpress'; then
              echo "Container sanoto-wordpress is still stuck after waiting."
              docker ps -a --filter "name=sanoto-wordpress"
              docker inspect sanoto-wordpress --format='Status={{.State.Status}} Error={{.State.Error}} ExitCode={{.State.ExitCode}}' || true
              exit 1
            fi

            echo "== Recreate container =="
            docker compose --env-file .compose.env up -d --force-recreate --remove-orphans wordpress

            echo "== Cleanup =="
            docker image prune -f || true

            echo "== Wait and check container status =="
            sleep 10
            docker ps -a --filter "name=sanoto-wordpress"

            echo "== Container logs =="
            docker logs --tail=200 sanoto-wordpress || true

            echo "== Inspect container command =="
            docker inspect sanoto-wordpress --format='Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true

            echo "== Inspect mounts =="
            docker inspect sanoto-wordpress --format='{{range .Mounts}}{{println .Source "=>" .Destination}}{{end}}' || true

            echo "== Check /var/www/html/.env in container =="
            if docker ps --filter "name=sanoto-wordpress" --filter "status=running" | grep -q sanoto-wordpress; then
              docker exec sanoto-wordpress sh -lc 'ls -la /var/www/html/.env'
              docker exec sanoto-wordpress sh -lc 'grep -n "DRONE\|PREV_COMMAND\|\$? ; if" /var/www/html/.env && exit 1 || echo "OK: container .env clean"'
              docker exec sanoto-wordpress sh -lc "grep -E '^(DB_NAME|DB_USER|DB_HOST|WP_ENV|WP_HOME|WP_SITEURL|SMS_TOKEN|SMS_SENDER|B2B_CASSO_WEBHOOK_TOKEN|B2B_BANK_ACCOUNT_NAME|B2B_BANK_ACCOUNT_NUMBER|B2B_BANK_BIN|B2B_BANK_NAME)=' /var/www/html/.env | sed 's/=.*/=***MASKED***/'"
            else
              echo "Container is not running. See logs above."
              exit 1
            fi

            echo "== Final HTTP test =="
            curl -I http://127.0.0.1:8001 || true
