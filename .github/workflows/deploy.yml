name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"

            mkdir -p "$PROJECT_PATH"
            cd "$PROJECT_PATH"

            echo "== Docker version =="
            docker --version
            docker compose version

            echo "== Disk and memory before deploy =="
            df -h
            free -m || true

            # File .env này chỉ dành cho Docker Compose interpolation.
            # Không để WordPress salts ở đây vì salts có ký tự $, `, #... dễ bị Compose hiểu nhầm.
            cat > .env <<'COMPOSE_ENV_EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT }}
            COMPOSE_ENV_EOF

            # File app.env dành cho WordPress/Bedrock/PHP.
            # File này cũng được mount vào /var/www/html/.env để app đọc được.
            cat > app.env <<'APP_ENV_EOF'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}

            WP_ENV=${{ secrets.WP_ENV }}
            WP_HOME=${{ secrets.WP_HOME }}
            WP_SITEURL=${{ secrets.WP_SITEURL }}

            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}

            SMS_TOKEN=${{ secrets.SMS_TOKEN }}
            SMS_SENDER=${{ secrets.SMS_SENDER }}

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

            B2B_CASSO_WEBHOOK_TOKEN=${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}

            AUTH_KEY='${{ secrets.AUTH_KEY }}'
            SECURE_AUTH_KEY='${{ secrets.SECURE_AUTH_KEY }}'
            LOGGED_IN_KEY='${{ secrets.LOGGED_IN_KEY }}'
            NONCE_KEY='${{ secrets.NONCE_KEY }}'
            AUTH_SALT='${{ secrets.AUTH_SALT }}'
            SECURE_AUTH_SALT='${{ secrets.SECURE_AUTH_SALT }}'
            LOGGED_IN_SALT='${{ secrets.LOGGED_IN_SALT }}'
            NONCE_SALT='${{ secrets.NONCE_SALT }}'
            APP_ENV_EOF

            chmod 600 .env app.env

            cat > docker-compose.yml <<'COMPOSE_YAML_EOF'
services:
  wordpress:
    image: ${DOCKERHUB_USERNAME}/b2b-oto:latest
    container_name: sanoto-wordpress
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - app.env

    ports:
      - "${APP_PORT:-8001}:80"

    volumes:
      - ./app.env:/var/www/html/.env:ro
      - uploads_data:/var/www/html/web/app/uploads
      - cache_data:/var/www/html/web/app/cache

        volumes:
          uploads_data:
          cache_data:
        COMPOSE_YAML_EOF

            echo "== Login Docker Hub =="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "== Validate docker-compose.yml =="
            docker compose --env-file .env config

            echo "== Pull latest image =="
            docker compose --env-file .env pull wordpress

            echo "== Recreate wordpress container =="
            docker compose --env-file .env up -d --force-recreate wordpress

            echo "== Clean unused images =="
            docker image prune -f || true

            echo "== Check running containers =="
            docker ps

            echo "== Check important env inside container =="
            docker exec sanoto-wordpress bash -lc 'printenv | grep -E "DB_HOST|WP_HOME|WP_SITEURL|SMS_TOKEN|SMS_SENDER|MAIL_USERNAME|CLOUDINARY_CLOUD_NAME" || true'
