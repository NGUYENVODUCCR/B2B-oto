name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            mkdir -p ${{ secrets.VPS_PROJECT_PATH }}
            cd ${{ secrets.VPS_PROJECT_PATH }}

            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}

            WP_ENV=${{ secrets.WP_ENV }}
            WP_HOME=${{ secrets.WP_HOME }}
            WP_SITEURL=${{ secrets.WP_SITEURL }}

            AUTH_KEY=${{ secrets.AUTH_KEY }}
            SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}
            LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}
            NONCE_KEY=${{ secrets.NONCE_KEY }}
            AUTH_SALT=${{ secrets.AUTH_SALT }}
            SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}
            LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}
            NONCE_SALT=${{ secrets.NONCE_SALT }}

            B2B_CASSO_WEBHOOK_TOKEN=${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}

            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            chmod 600 .env

            cat > docker-compose.yml <<EOF
            services:
              wordpress:
                image: \${DOCKERHUB_USERNAME}/b2b-oto:latest

                container_name: sanoto-wordpress

                restart: unless-stopped

                extra_hosts:
                  - "host.docker.internal:host-gateway"

                env_file:
                  - .env

                environment:
                  DB_HOST: ${DB_HOST}
                  DB_NAME: \${DB_NAME}
                  DB_USER: \${DB_USER}
                  DB_PASSWORD: \${DB_PASSWORD}

                  WP_ENV: \${WP_ENV}
                  WP_HOME: \${WP_HOME}
                  WP_SITEURL: \${WP_SITEURL}

                ports:
                  - "8001:80"

                volumes:
                  - uploads_data:/var/www/html/web/app/uploads
                  - cache_data:/var/www/html/web/app/cache

            volumes:
              uploads_data:
              cache_data:
            EOF

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker compose pull wordpress

            docker compose up -d

            docker image prune -f
