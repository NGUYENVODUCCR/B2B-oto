name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            mkdir -p "${{ secrets.VPS_PROJECT_PATH }}"
            cd "${{ secrets.VPS_PROJECT_PATH }}"

            cat > .env <<'ENVEOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT }}

            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}

            WP_ENV=${{ secrets.WP_ENV }}
            WP_HOME=${{ secrets.WP_HOME }}
            WP_SITEURL=${{ secrets.WP_SITEURL }}

            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME="${{ secrets.MAIL_FROM_NAME }}"

            SMS_TOKEN=${{ secrets.SMS_TOKEN }}
            SMS_SENDER=${{ secrets.SMS_SENDER }}

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

            B2B_CASSO_WEBHOOK_TOKEN=${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}

            AUTH_KEY=${{ secrets.AUTH_KEY }}
            SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}
            LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}
            NONCE_KEY=${{ secrets.NONCE_KEY }}
            AUTH_SALT=${{ secrets.AUTH_SALT }}
            SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}
            LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}
            NONCE_SALT=${{ secrets.NONCE_SALT }}
            ENVEOF

                        chmod 600 .env

                        cat > docker-compose.yml <<'COMPOSEEOF'
            services:
              wordpress:
                image: ${DOCKERHUB_USERNAME}/b2b-oto:latest
                container_name: sanoto-wordpress
                restart: unless-stopped

                extra_hosts:
                  - "host.docker.internal:host-gateway"

                env_file:
                  - .env

                ports:
                  - "${APP_PORT:-8001}:80"

                volumes:
                  - uploads_data:/var/www/html/web/app/uploads
                  - cache_data:/var/www/html/web/app/cache

            volumes:
              uploads_data:
              cache_data:
            COMPOSEEOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose config >/dev/null
            docker compose pull wordpress
            docker compose up -d --force-recreate wordpress
            docker image prune -f

            docker exec sanoto-wordpress bash -lc 'printenv | grep -E "DB_HOST|WP_HOME|WP_SITEURL|SMS_TOKEN|SMS_SENDER|MAIL_USERNAME|CLOUDINARY_CLOUD_NAME" || true'
