name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            mkdir -p ${{ secrets.VPS_PROJECT_PATH }}
            cd ${{ secrets.VPS_PROJECT_PATH }}

            rm -f .env

            printf '%s\n' "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env

            printf '%s\n' "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            printf '%s\n' "DB_USER=${{ secrets.DB_USER }}" >> .env
            printf '%s\n' "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            printf '%s\n' "DB_HOST=${{ secrets.DB_HOST }}" >> .env

            printf '%s\n' "WP_ENV=${{ secrets.WP_ENV }}" >> .env
            printf '%s\n' "WP_HOME=${{ secrets.WP_HOME }}" >> .env
            printf '%s\n' "WP_SITEURL=${{ secrets.WP_SITEURL }}" >> .env

            printf '%s\n' "AUTH_KEY=${{ secrets.AUTH_KEY }}" >> .env
            printf '%s\n' "SECURE_AUTH_KEY=${{ secrets.SECURE_AUTH_KEY }}" >> .env
            printf '%s\n' "LOGGED_IN_KEY=${{ secrets.LOGGED_IN_KEY }}" >> .env
            printf '%s\n' "NONCE_KEY=${{ secrets.NONCE_KEY }}" >> .env

            printf '%s\n' "AUTH_SALT=${{ secrets.AUTH_SALT }}" >> .env
            printf '%s\n' "SECURE_AUTH_SALT=${{ secrets.SECURE_AUTH_SALT }}" >> .env
            printf '%s\n' "LOGGED_IN_SALT=${{ secrets.LOGGED_IN_SALT }}" >> .env
            printf '%s\n' "NONCE_SALT=${{ secrets.NONCE_SALT }}" >> .env

            printf '%s\n' "B2B_CASSO_WEBHOOK_TOKEN=${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}" >> .env

            printf '%s\n' "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
            printf '%s\n' "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
            printf '%s\n' "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
            printf '%s\n' "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
            printf '%s\n' "MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}" >> .env
            printf '%s\n' "MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}" >> .env

            printf '%s\n' "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
            printf '%s\n' "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
            printf '%s\n' "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env

            chmod 600 .env

            docker login \
              -u ${{ secrets.DOCKERHUB_USERNAME }} \
              -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker compose pull

            docker compose down

            docker compose up -d

            docker image prune -f