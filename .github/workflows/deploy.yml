name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"

            mkdir -p "$PROJECT_PATH"
            cd "$PROJECT_PATH"

            echo "== Docker version =="
            docker --version
            docker compose version

            echo "== Create compose env =="
            cat > .compose.env <<'COMPOSE_ENV_EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT }}
            COMPOSE_ENV_EOF

            echo "== Create runtime env =="
            cat > runtime.env <<'RUNTIME_ENV_EOF'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}

            WP_ENV=${{ secrets.WP_ENV }}
            WP_HOME=${{ secrets.WP_HOME }}
            WP_SITEURL=${{ secrets.WP_SITEURL }}

            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}

            SMS_TOKEN=${{ secrets.SMS_TOKEN }}
            SMS_SENDER=${{ secrets.SMS_SENDER }}

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

            B2B_CASSO_WEBHOOK_TOKEN=${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}
            RUNTIME_ENV_EOF

            echo "== Create app env for Bedrock =="
            cat runtime.env > app.env
            cat >> app.env <<'APP_ENV_EOF'

            AUTH_KEY='${{ secrets.AUTH_KEY }}'
            SECURE_AUTH_KEY='${{ secrets.SECURE_AUTH_KEY }}'
            LOGGED_IN_KEY='${{ secrets.LOGGED_IN_KEY }}'
            NONCE_KEY='${{ secrets.NONCE_KEY }}'
            AUTH_SALT='${{ secrets.AUTH_SALT }}'
            SECURE_AUTH_SALT='${{ secrets.SECURE_AUTH_SALT }}'
            LOGGED_IN_SALT='${{ secrets.LOGGED_IN_SALT }}'
            NONCE_SALT='${{ secrets.NONCE_SALT }}'
            APP_ENV_EOF

            chmod 644 .compose.env runtime.env app.env

            echo "== Create docker-compose.yml =="
            rm -f docker-compose.yml

            printf '%s\n' 'services:' >> docker-compose.yml
            printf '%s\n' '  wordpress:' >> docker-compose.yml
            printf '%s\n' '    image: ${DOCKERHUB_USERNAME}/b2b-oto:latest' >> docker-compose.yml
            printf '%s\n' '    container_name: sanoto-wordpress' >> docker-compose.yml
            printf '%s\n' '    restart: unless-stopped' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' '    entrypoint: ["/bin/sh", "-lc"]' >> docker-compose.yml
            printf '%s\n' '    command: >' >> docker-compose.yml
            printf '%s\n' '      "mkdir -p /var/www/html/web/app/uploads' >> docker-compose.yml
            printf '%s\n' '      /var/www/html/web/app/cache/acorn/framework/views' >> docker-compose.yml
            printf '%s\n' '      /var/www/html/web/app/cache/acorn/framework/cache' >> docker-compose.yml
            printf '%s\n' '      /var/www/html/web/app/cache/acorn/framework/sessions' >> docker-compose.yml
            printf '%s\n' '      && chown -R www-data:www-data /var/www/html/web/app/uploads /var/www/html/web/app/cache' >> docker-compose.yml
            printf '%s\n' '      && apache2-foreground"' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' '    extra_hosts:' >> docker-compose.yml
            printf '%s\n' '      - "host.docker.internal:host-gateway"' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' '    env_file:' >> docker-compose.yml
            printf '%s\n' '      - runtime.env' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' '    ports:' >> docker-compose.yml
            printf '%s\n' '      - "${APP_PORT:-8001}:80"' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' '    volumes:' >> docker-compose.yml
            printf '%s\n' '      - ./app.env:/var/www/html/.env:ro' >> docker-compose.yml
            printf '%s\n' '      - uploads_data:/var/www/html/web/app/uploads' >> docker-compose.yml
            printf '%s\n' '      - cache_data:/var/www/html/web/app/cache' >> docker-compose.yml
            printf '%s\n' '' >> docker-compose.yml
            printf '%s\n' 'volumes:' >> docker-compose.yml
            printf '%s\n' '  uploads_data:' >> docker-compose.yml
            printf '%s\n' '  cache_data:' >> docker-compose.yml

            echo "== Show generated docker-compose.yml =="
            cat -n docker-compose.yml

            echo "== Check env files =="
            ls -la .compose.env runtime.env app.env docker-compose.yml
            test -s .compose.env
            test -s runtime.env
            test -s app.env
            test -s docker-compose.yml

            echo "== Docker login =="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "== Validate compose =="
            docker compose --env-file .compose.env config >/dev/null

            echo "== Pull image =="
            docker compose --env-file .compose.env pull wordpress

            echo "== Stop old compose containers =="
            docker compose --env-file .compose.env down --remove-orphans || true

            echo "== Force remove stuck sanoto-wordpress container =="
            for i in $(seq 1 30); do
              if docker ps -a --format '{{.Names}}' | grep -qx 'sanoto-wordpress'; then
                echo "Attempt $i: sanoto-wordpress still exists, trying to remove..."
                docker rm -f sanoto-wordpress || true
                sleep 2
              else
                echo "Old sanoto-wordpress container removed."
                break
              fi
            done

            if docker ps -a --format '{{.Names}}' | grep -qx 'sanoto-wordpress'; then
              echo "Container sanoto-wordpress is still stuck after waiting."
              docker ps -a --filter "name=sanoto-wordpress"
              docker inspect sanoto-wordpress --format='Status={{.State.Status}} Error={{.State.Error}} ExitCode={{.State.ExitCode}}' || true
              exit 1
            fi

            echo "== Recreate container =="
            docker compose --env-file .compose.env up -d --remove-orphans wordpress

            echo "== Cleanup =="
            docker image prune -f || true

            echo "== Wait and check container status =="
            sleep 10
            docker ps -a --filter "name=sanoto-wordpress"

            echo "== Container logs =="
            docker logs --tail=200 sanoto-wordpress || true

            echo "== Inspect container command =="
            docker inspect sanoto-wordpress --format='Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true

            echo "== Inspect mounts =="
            docker inspect sanoto-wordpress --format='{{range .Mounts}}{{println .Source "=>" .Destination}}{{end}}' || true

            echo "== Check /var/www/html/.env in container =="
            if docker ps --filter "name=sanoto-wordpress" --filter "status=running" | grep -q sanoto-wordpress; then
              docker exec sanoto-wordpress sh -lc 'ls -la /var/www/html/.env && head -n 10 /var/www/html/.env'
              docker exec sanoto-wordpress sh -lc 'printenv | grep -E "DB_HOST|WP_HOME|WP_SITEURL|SMS_TOKEN|SMS_SENDER|MAIL_USERNAME|CLOUDINARY_CLOUD_NAME" || true'
            else
              echo "Container is not running. See logs above."
              exit 1
            fi