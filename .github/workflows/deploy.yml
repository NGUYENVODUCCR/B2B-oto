name: Build and Deploy Sanoto B2B

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sanoto-b2b-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 60m
          script: |
            set -Eeuo pipefail
            
            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"
            IMAGE_TAG="${{ github.sha }}"
            
            if [ -z "$PROJECT_PATH" ]; then
              echo "VPS_PROJECT_PATH is empty. Please set it to /opt/sanoto-b2b in GitHub Secrets."
              exit 1
            fi
            
            mkdir -p "$PROJECT_PATH"
            cd "$PROJECT_PATH"
            
            unset DRONE_SSH_PREV_COMMAND_EXIT_CODE || true
            rm -f .env
            
            echo "== Docker version =="
            docker --version
            docker compose version
            
            echo "== Create compose env =="
            cat > .compose.env <<COMPOSE_ENV_EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT }}
            PROJECT_PATH=${{ secrets.VPS_PROJECT_PATH }}
            IMAGE_TAG=${{ github.sha }}
            COMPOSE_ENV_EOF
            
            echo "== Create runtime env =="
            cat > runtime.env <<'RUNTIME_ENV_EOF'
            DB_NAME='${{ secrets.DB_NAME }}'
            DB_USER='${{ secrets.DB_USER }}'
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            DB_HOST='host.docker.internal:3306'
            
            WP_ENV='${{ secrets.WP_ENV }}'
            WP_HOME='${{ secrets.WP_HOME }}'
            WP_SITEURL='${{ secrets.WP_SITEURL }}'
            
            MAIL_HOST='smtp-relay.brevo.com'
            MAIL_PORT='587'
            MAIL_ENCRYPTION='tls'
            MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
            MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'
            MAIL_FROM_EMAIL='${{ secrets.MAIL_FROM_EMAIL }}'
            MAIL_FROM_ADDRESS='${{ secrets.MAIL_FROM_EMAIL }}'
            MAIL_FROM_NAME='Sanoto B2B'
            
            SMS_TOKEN='${{ secrets.SMS_TOKEN }}'
            SMS_SENDER='${{ secrets.SMS_SENDER }}'
            
            CLOUDINARY_CLOUD_NAME='${{ secrets.CLOUDINARY_CLOUD_NAME }}'
            CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}'
            CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}'
            
            B2B_CASSO_WEBHOOK_TOKEN='${{ secrets.B2B_CASSO_WEBHOOK_TOKEN }}'
            B2B_BANK_ACCOUNT_NAME='${{ secrets.B2B_BANK_ACCOUNT_NAME }}'
            B2B_BANK_ACCOUNT_NUMBER='${{ secrets.B2B_BANK_ACCOUNT_NUMBER }}'
            B2B_BANK_BIN='${{ secrets.B2B_BANK_BIN }}'
            B2B_BANK_NAME='${{ secrets.B2B_BANK_NAME }}'
            RUNTIME_ENV_EOF
            
            echo "== Create app env for Bedrock =="
            cp runtime.env app.env
            
            cat >> app.env <<'APP_ENV_EOF'
            
            AUTH_KEY='${{ secrets.AUTH_KEY }}'
            SECURE_AUTH_KEY='${{ secrets.SECURE_AUTH_KEY }}'
            LOGGED_IN_KEY='${{ secrets.LOGGED_IN_KEY }}'
            NONCE_KEY='${{ secrets.NONCE_KEY }}'
            AUTH_SALT='${{ secrets.AUTH_SALT }}'
            SECURE_AUTH_SALT='${{ secrets.SECURE_AUTH_SALT }}'
            LOGGED_IN_SALT='${{ secrets.LOGGED_IN_SALT }}'
            NONCE_SALT='${{ secrets.NONCE_SALT }}'
            APP_ENV_EOF
            
            echo "== Sanitize env files =="
            sed -i '/DRONE_SSH_PREV_COMMAND_EXIT_CODE/d' .compose.env runtime.env app.env 2>/dev/null || true
            sed -i '/PREV_COMMAND_EXIT_CODE/d' .compose.env runtime.env app.env 2>/dev/null || true
            sed -i '/\$? ; if \[/d' .compose.env runtime.env app.env 2>/dev/null || true
            sed -i 's/[[:space:]]*$//' .compose.env runtime.env app.env 2>/dev/null || true
            chmod 644 .compose.env runtime.env app.env
            
            echo "== Verify env files are clean =="
            if grep -RniE 'DRONE_SSH|PREV_COMMAND|\$\? ; if' .compose.env runtime.env app.env 2>/dev/null; then
              echo "Dirty env content detected. Stop deploy."
              exit 1
            fi
            
            echo "== Create docker-compose.yml =="
            rm -f docker-compose.yml
            
            cat > docker-compose.yml <<'DOCKER_COMPOSE_EOF'
            services:
              wordpress:
                image: ${DOCKERHUB_USERNAME}/b2b-oto:${IMAGE_TAG}
                container_name: sanoto-wordpress
                restart: unless-stopped
            
                entrypoint: ["/bin/sh"]
                command:
                  - "-c"
                  - |
                    set -e
            
                    test -f /deploy-env/app.env
                    cp /deploy-env/app.env /var/www/html/.env
                    sed -i "s/^DB_HOST=.*/DB_HOST='host.docker.internal:3306'/" /var/www/html/.env
                    chmod 644 /var/www/html/.env
            
                    mkdir -p \
                      /var/www/html/web/app/uploads \
                      /var/www/html/web/app/cache/acorn/framework/views \
                      /var/www/html/web/app/cache/acorn/framework/cache \
                      /var/www/html/web/app/cache/acorn/framework/sessions
            
                    chown -R www-data:www-data \
                      /var/www/html/web/app/uploads \
                      /var/www/html/web/app/cache
            
                    printf '%s\n' '# BEGIN WordPress' '<IfModule mod_rewrite.c>' 'RewriteEngine On' 'RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]' 'RewriteBase /' 'RewriteRule ^index\.php$ - [L]' 'RewriteCond %{REQUEST_FILENAME} !-f' 'RewriteCond %{REQUEST_FILENAME} !-d' 'RewriteRule . /index.php [L]' '</IfModule>' '# END WordPress' > /var/www/html/web/.htaccess
            
                    chown www-data:www-data /var/www/html/web/.htaccess
                    chmod 644 /var/www/html/web/.htaccess
                    a2enmod rewrite >/dev/null 2>&1 || true
                    echo "OK" > /var/www/html/web/healthz.txt
            
                    exec apache2-foreground
            
                healthcheck:
                  test: ["CMD-SHELL", "curl -fsS http://localhost/healthz.txt || exit 1"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 30s
            
                extra_hosts:
                  - "host.docker.internal:host-gateway"
            
                env_file:
                  - ./runtime.env
            
                ports:
                  - "${APP_PORT:-8001}:80"
            
                volumes:
                  - ${PROJECT_PATH}:/deploy-env:ro
                  - uploads_data:/var/www/html/web/app/uploads
                  - cache_data:/var/www/html/web/app/cache
            
            volumes:
              uploads_data:
              cache_data:
            DOCKER_COMPOSE_EOF
            
            echo "== Show generated docker-compose.yml =="
            cat -n docker-compose.yml
            
            echo "== Check env files =="
            ls -la .compose.env runtime.env app.env docker-compose.yml
            test -s .compose.env
            test -s runtime.env
            test -s app.env
            test -s docker-compose.yml
            
            echo "== Docker login with timeout =="
            LOGIN_OK=0
            for i in 1 2 3; do
              echo "Docker login attempt $i/3..."
              if echo "${{ secrets.DOCKERHUB_TOKEN }}" | timeout --kill-after=10s 60s docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin; then
                echo "Docker login success."
                LOGIN_OK=1
                break
              fi
              echo "Docker login failed or timed out. Retry after 10 seconds..."
              sleep 10
            done
            
            if [ "$LOGIN_OK" != "1" ]; then
              echo "Docker login failed. Continue anyway; pull may still work if the image is public or VPS is already logged in."
            fi
            
            echo "== Validate compose =="
            docker compose --env-file .compose.env config >/dev/null
            
            echo "== Pull image with shorter timeout and retry =="
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/b2b-oto:${{ github.sha }}"
            PULL_OK=0
            
            for i in 1 2 3; do
              echo "Pull attempt $i/3..."
              if timeout --kill-after=20s 240s docker pull "$IMAGE"; then
                echo "Pull image success."
                PULL_OK=1
                break
              fi
              echo "Pull image attempt $i failed or timed out."
              sleep 15
            done
            
            if [ "$PULL_OK" != "1" ]; then
              echo "Pull image failed after 3 attempts. Stop deploy to avoid using old code."
              exit 1
            fi
            
            echo "== Stop old compose containers =="
            docker compose --env-file .compose.env stop -t 20 wordpress || true
            docker compose --env-file .compose.env down --timeout 20 --remove-orphans || true
            docker rm -f sanoto-wordpress 2>/dev/null || true
            
            echo "== Recreate container =="
            docker compose --env-file .compose.env up -d --force-recreate --remove-orphans wordpress
            
            echo "== Wait and check container status =="
            sleep 10
            docker ps -a --filter "name=sanoto-wordpress"
            
            echo "== Inspect container command =="
            docker inspect sanoto-wordpress --format='Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true
            
            echo "== Inspect mounts =="
            docker inspect sanoto-wordpress --format='{{range .Mounts}}{{println .Source "=>" .Destination}}{{end}}' || true
            
            echo "== Container logs =="
            docker logs --tail=120 sanoto-wordpress || true
            
            echo "== Check /var/www/html/.env in container =="
            if docker ps --filter "name=sanoto-wordpress" --filter "status=running" | grep -q sanoto-wordpress; then
              docker exec sanoto-wordpress sh -lc 'ls -la /var/www/html/.env'
              docker exec sanoto-wordpress sh -lc 'grep -n "DRONE\|PREV_COMMAND\|\$? ; if" /var/www/html/.env && exit 1 || echo "OK: container .env clean"'
              docker exec sanoto-wordpress sh -lc "grep -E '^(DB_NAME|DB_USER|DB_HOST|WP_ENV|WP_HOME|WP_SITEURL|SMS_TOKEN|SMS_SENDER|B2B_CASSO_WEBHOOK_TOKEN|B2B_BANK_ACCOUNT_NAME|B2B_BANK_ACCOUNT_NUMBER|B2B_BANK_BIN|B2B_BANK_NAME)=' /var/www/html/.env | sed 's/=.*/=***MASKED***/'"
            else
              echo "Container is not running. See logs above."
              exit 1
            fi
            
            echo "== Check DB connection from container =="
            docker exec sanoto-wordpress sh -lc '
              set -a
              . /var/www/html/.env
              set +a
              DB_HOST_ONLY="${DB_HOST%:*}"
              DB_PORT_ONLY="${DB_HOST##*:}"
              echo "DB_HOST=$DB_HOST"
              timeout 10 mysql -h "$DB_HOST_ONLY" -P "$DB_PORT_ONLY" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT 1;"
            '
            
            echo "== Final HTTP tests =="
            curl -I --max-time 15 http://127.0.0.1:8001/healthz.txt
            curl -I --max-time 20 http://127.0.0.1:8001 || true
            
            echo "== Cleanup dangling images =="
            docker image prune -f || true
